[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudshield-iq-backend"
version = "0.1.0"
description = "CloudShield IQ — AI-Based Multi-Cloud Security Risk Assessment Backend"
requires-python = ">=3.11"

dependencies = [
    # --- Web Framework ---
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # --- Validation ---
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "email-validator>=2.1.1",

    # --- Database ---
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",

    # --- Authentication / Security ---
    "argon2-cffi>=23.1.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[argon2]>=1.7.4",

    # --- ML Core ---
    "scikit-learn>=1.5.0",
    "xgboost>=2.0.3",
    "shap>=0.45.0",
    "pandas>=2.2.2",
    "numpy>=1.26.4",
    "joblib>=1.4.2",

    # --- Data Ingestion ---
    "python-magic>=0.4.27",

    # --- Utilities ---
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "structlog>=24.2.0",
    "tenacity>=8.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "ruff>=0.4.9",
    "mypy>=1.10.0",
    "pre-commit>=3.7.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP", "S", "B", "A", "C4", "RET", "SIM"]
ignore = ["S101"]  # assert is allowed in tests

[tool.ruff.per-file-ignores]
"tests/**" = ["S", "ARG"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "alembic/*"]
